[project]
name = "campaign-driver"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-aiplatform[agent-engines]>=1.164.0",
    "google-cloud-firestore>=2.16.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.25.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
